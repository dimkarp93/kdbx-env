name: Release

on:
  push:
    branches: [main, master]

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SERVER_URL: http://gitea:3000
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          REPOSITORY: ${{ gitea.repository }}
          SHA: ${{ gitea.sha }}
        run: |
          set -eu
          auth=$(printf '%s:' "$TOKEN" | base64 | tr -d '\n')
          git init -q .
          git remote add origin "${SERVER_URL}/${REPOSITORY}.git"
          git config --local "http.extraheader" "Authorization: Basic ${auth}"
          git fetch -q --no-tags --depth=1 origin "$SHA"
          git checkout -q FETCH_HEAD

      - name: Read version
        id: ver
        env:
          REPOSITORY: ${{ gitea.repository }}
          PUBLIC_URL: ${{ gitea.server_url }}
          SHA: ${{ gitea.sha }}
        run: |
          set -eu
          if [ ! -f versions.txt ]; then
            echo "versions.txt not found" >&2
            exit 1
          fi
          v=$(tr -d '[:space:]' < versions.txt)
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "versions.txt must contain semver X.Y.Z (got: '$v')" >&2
            exit 1
          fi
          bin="${REPOSITORY##*/}"
          origin="${PUBLIC_URL%/}/${REPOSITORY}"
          if [ -f upstream.txt ]; then
            upstream=$(tr -d '[:space:]' < upstream.txt)
          else
            upstream="$origin"
          fi
          echo "version=$v"          >> "$GITEA_OUTPUT"
          echo "tag=v$v"             >> "$GITEA_OUTPUT"
          echo "bin=$bin"            >> "$GITEA_OUTPUT"
          echo "origin=$origin"      >> "$GITEA_OUTPUT"
          echo "upstream=$upstream"  >> "$GITEA_OUTPUT"
          echo "commit=$(printf '%s' "$SHA" | cut -c1-7)" >> "$GITEA_OUTPUT"

      - name: Check tag existence
        id: tagcheck
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -eu
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists, skipping release"
            echo "exists=true" >> "$GITEA_OUTPUT"
          else
            echo "exists=false" >> "$GITEA_OUTPUT"
          fi

      - name: Setup Go
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          set -eu
          if [ ! -f go.mod ]; then
            echo "go.mod not found" >&2
            exit 1
          fi
          gv=$(awk '/^toolchain /{print $2; exit}' go.mod | sed 's/^go//')
          if [ -z "$gv" ]; then
            gv=$(awk '/^go /{print $2; exit}' go.mod)
          fi
          if [ -z "$gv" ]; then
            echo "failed to detect Go version from go.mod" >&2
            exit 1
          fi
          case "$gv" in
            *.*.*) ;;
            *)
              json=$(curl -fsSL "https://go.dev/dl/?mode=json&include=all")
              full=$(printf '%s\n' "$json" \
                | grep -o "go${gv}\.[0-9]*" \
                | sort -V | tail -n1 | sed 's/^go//')
              gv="${full:-${gv}.0}"
              ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64)  arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          root="$HOME/.local"
          mkdir -p "$root"
          rm -rf "$root/go"
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          curl -fsSL "https://go.dev/dl/go${gv}.${os}-${arch}.tar.gz" -o "$root/go.tar.gz"
          tar -C "$root" -xzf "$root/go.tar.gz"
          rm -f "$root/go.tar.gz"
          echo "$root/go/bin" >> "$GITEA_PATH"
          "$root/go/bin/go" version

      - name: Run tests
        if: steps.tagcheck.outputs.exists == 'false'
        run: go test ./...

      - name: Build archives
        if: steps.tagcheck.outputs.exists == 'false'
        env:
          BIN: ${{ steps.ver.outputs.bin }}
          VERSION: ${{ steps.ver.outputs.version }}
          ORIGIN: ${{ steps.ver.outputs.origin }}
          UPSTREAM: ${{ steps.ver.outputs.upstream }}
          COMMIT: ${{ steps.ver.outputs.commit }}
          CHANNEL: gitea-release
        run: |
          set -eu
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="${BIN}-${os}-${arch}"
            out="dist/${name}.tar.gz"
            tmp=$(mktemp -d)
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags="-s -w -X main.version=${VERSION} -X main.origin=${ORIGIN} -X main.upstream=${UPSTREAM} -X main.commit=${COMMIT} -X main.channel=${CHANNEL}" \
                -o "$tmp/${BIN}" .
            chmod +x "$tmp/${BIN}"
            tar -C "$tmp" -czf "$out" "${BIN}"
            rm -rf "$tmp"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          ls -la dist

      - name: Create release
        if: steps.tagcheck.outputs.exists == 'false'
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          REPOSITORY: ${{ gitea.repository }}
          SHA: ${{ gitea.sha }}
        run: |
          set -eu
          api="${SERVER_URL}/api/v1/repos/${REPOSITORY}"
          body=$(printf '{"tag_name":"%s","target_commitish":"%s","name":"%s","body":"Automated release %s from versions.txt"}' \
            "$TAG" "$SHA" "$TAG" "$TAG")
          resp=$(curl -fsS -X POST "${api}/releases" \
            -H "Authorization: token ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$body")
          if command -v jq >/dev/null 2>&1; then
            id=$(printf '%s' "$resp" | jq -r '.id')
          else
            id=$(printf '%s' "$resp" | grep -o '"id":[[:space:]]*[0-9]*' | head -n1 | tr -dc '0-9')
          fi
          if [ -z "$id" ]; then
            echo "failed to get release id from Gitea response: $resp" >&2
            exit 1
          fi
          for f in dist/*; do
            echo "Uploading $(basename "$f")"
            curl -fsS -X POST "${api}/releases/${id}/assets?name=$(basename "$f")" \
              -H "Authorization: token ${TOKEN}" \
              -F "attachment=@${f}" >/dev/null
          done
          echo "Release ${TAG} created"
