name: Release

on:
  push:
    branches: [main, master]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          auth=$(printf '%s:' "$TOKEN" | base64 | tr -d '\n')
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git config --local "http.extraheader" "Authorization: Basic ${auth}"
          git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      - name: Read version
        id: ver
        run: |
          set -eu
          if [ ! -f versions.txt ]; then
            echo "versions.txt не найден" >&2
            exit 1
          fi
          v=$(tr -d '[:space:]' < versions.txt)
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "versions.txt должен содержать semver X.Y.Z (получено: '$v')" >&2
            exit 1
          fi
          bin="${GITHUB_REPOSITORY##*/}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v"    >> "$GITHUB_OUTPUT"
          echo "bin=$bin"   >> "$GITHUB_OUTPUT"

      - name: Check tag existence
        id: tagcheck
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -eu
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Тег ${TAG} уже существует — пропускаем релиз"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          set -eu
          if [ ! -f go.mod ]; then
            echo "go.mod не найден" >&2
            exit 1
          fi
          gv=$(awk '/^toolchain /{print $2; exit}' go.mod | sed 's/^go//')
          if [ -z "$gv" ]; then
            gv=$(awk '/^go /{print $2; exit}' go.mod)
          fi
          if [ -z "$gv" ]; then
            echo "не удалось определить версию Go из go.mod" >&2
            exit 1
          fi
          case "$gv" in
            *.*.*) ;;
            *)
              full=$(curl -fsSL "https://go.dev/dl/?mode=json&include=all" \
                | grep -o "\"go${gv}\.[0-9]*\"" | head -n1 | tr -d '"' | sed 's/^go//')
              gv="${full:-${gv}.0}"
              ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64)  arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "неподдерживаемая архитектура раннера: $(uname -m)" >&2; exit 1 ;;
          esac
          root="$HOME/.local"
          mkdir -p "$root"
          rm -rf "$root/go"
          curl -fsSL "https://go.dev/dl/go${gv}.$(uname -s | tr '[:upper:]' '[:lower:]')-${arch}.tar.gz" \
            | tar -C "$root" -xz
          echo "$root/go/bin" >> "$GITHUB_PATH"
          "$root/go/bin/go" version

      - name: Run tests
        if: steps.tagcheck.outputs.exists == 'false'
        run: go test ./...

      - name: Build archives
        if: steps.tagcheck.outputs.exists == 'false'
        env:
          BIN: ${{ steps.ver.outputs.bin }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="${BIN}-${os}-${arch}"
            out="dist/${name}.tar.gz"
            tmp=$(mktemp -d)
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags="-s -w -X main.version=${VERSION}" \
                -o "$tmp/${BIN}" .
            chmod +x "$tmp/${BIN}"
            tar -C "$tmp" -czf "$out" "${BIN}"
            rm -rf "$tmp"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          ls -la dist

      - name: Create release
        if: steps.tagcheck.outputs.exists == 'false'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -eu
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          body=$(printf '{"tag_name":"%s","target_commitish":"%s","name":"%s","body":"Автоматический релиз %s из versions.txt"}' \
            "$TAG" "$GITHUB_SHA" "$TAG" "$TAG")
          resp=$(curl -fsS -X POST "${api}/releases" \
            -H "Authorization: token ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$body")
          if command -v jq >/dev/null 2>&1; then
            id=$(printf '%s' "$resp" | jq -r '.id')
          else
            id=$(printf '%s' "$resp" | grep -o '"id":[[:space:]]*[0-9]*' | head -n1 | tr -dc '0-9')
          fi
          if [ -z "$id" ]; then
            echo "не удалось получить id релиза из ответа Gitea: $resp" >&2
            exit 1
          fi
          for f in dist/*; do
            echo "Загружаю $(basename "$f")"
            curl -fsS -X POST "${api}/releases/${id}/assets?name=$(basename "$f")" \
              -H "Authorization: token ${TOKEN}" \
              -F "attachment=@${f}" >/dev/null
          done
          echo "Релиз ${TAG} создан"
